name: Release

# Pushing a tag like v0.1.0 builds amd64 + arm64 exes and publishes a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

      - name: build
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          ./build.ps1 -Version $v -Arch amd64 -Out dist/batterymon.exe
          ./build.ps1 -Version $v -Arch arm64 -Out dist/batterymon-arm64.exe
          foreach ($a in 'amd64', 'arm64') {
            $exe = if ($a -eq 'amd64') { 'dist/batterymon.exe' } else { 'dist/batterymon-arm64.exe' }
            $dir = "dist/go-battery-monitor-$v-windows-$a"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item $exe "$dir/batterymon.exe"
            Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.txt $dir
            Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"
          }
          Get-FileHash dist/*.zip, dist/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt

      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.zip dist/batterymon.exe dist/batterymon-arm64.exe dist/SHA256SUMS.txt \
            --title "${{ github.ref_name }}" --generate-notes
