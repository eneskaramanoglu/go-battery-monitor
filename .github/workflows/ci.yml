name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Not gofmt'ed:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        shell: pwsh
        run: ./build.ps1 -Version "ci-${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: batterymon-${{ github.sha }}
          path: bin/batterymon.exe
